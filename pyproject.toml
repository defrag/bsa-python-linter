[project]
name = "bsa-architecture-linter"
version = "0.1.0b1"
description = "BSA architecture linter for Python applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["tach==0.35.1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://boundedsoftwarearchitecture.com"
Repository = "https://github.com/defrag/bsa-python-linter"
Issues = "https://github.com/defrag/bsa-python-linter/issues"
Documentation = "https://github.com/defrag/bsa-python-linter#readme"

[project.scripts]
bsa-lint = "bsa_linter.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsa_linter"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "pyrightconfig.json", "Makefile", "uv.lock"]

[dependency-groups]
dev = ["pyright==1.1.414", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

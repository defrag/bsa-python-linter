[project]
name = "bsa-architecture-linter"
version = "0.1.0"
description = "BSA architecture linter for Python applications"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["tach==0.35.1"]

[project.scripts]
bsa-lint = "bsa_linter.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsa_linter"]

[dependency-groups]
dev = ["pyright==1.1.414", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
